# BASTION MC | Mochilas. Todas las opciones se recargan con reinicio.
# Colores: &c, &l, &#RRGGBB y degradados caracter por caracter:
# '&#FF0000H&#EE1100o&#DD2200l&#CC3300a'
menu:
  title: '&#55DDAA&lTus Mochilas &8(&f{unlocked}&8/&f25&8)'
  size: 54
  # 25 posiciones modificables. Indices de 0 a 53.
  slots: [10, 11, 12, 13, 14, 19, 20, 21, 22, 23, 28, 29, 30, 31, 32, 37, 38, 39, 40, 41, 46, 47, 48, 49, 50]
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
  unlocked:
    material: BARREL
    name: '&#55FFAA&lMochila #{number} &a✔'
    glow: true
    lore:
      - '&7Capacidad: &f{slots} espacios'
      - '&#55FFAAHaz clic para abrir'
  locked:
    material: BARREL
    name: '&c&lMochila #{number} &8- &cBloqueado'
    glow: false
    lore:
      - '&cBloqueado'
      - '&7Capacidad: &f{slots} espacios'
      - '&7Sube de rango para desbloquearla'
backpack:
  title: '&#55DDAA&lMochila #{number} &8(&f{slots} espacios&8)'
  # Los tamaños se configuran individualmente; solo se admiten múltiplos de 9 de 9 a 54.
  default-size: 27
  sizes:
    '1': 27
    '2': 27
    '3': 27
    '4': 36
    '5': 36
    '6': 36
    '7': 36
    '8': 36
    '9': 36
    '10': 36
    '11': 54
    '12': 54
    '13': 54
    '14': 54
    '15': 54
    '16': 54
    '17': 54
    '18': 54
    '19': 54
    '20': 54
    '21': 54
    '22': 54
    '23': 54
    '24': 54
    '25': 54
permissions:
  admin-bypass: 'bastionbackpacks.admin'
  # Edita los permisos si necesitas nombres distintos. Si omites alguno: bastionbackpacks.use.<numero>.
  nodes: {}
data:
  # Los objetos se guardan al cerrar, al cambiar de mochila y al apagar el servidor.
  # Además se autosalvan periódicamente para reducir pérdidas en un cierre inesperado.
  autosave-seconds: 60
  # Si se reduce el tamaño de una mochila que tiene objetos en slots superiores,
  # la ampliamos en memoria para evitar pérdida de objetos.
  protect-items-from-size-reduction: true
