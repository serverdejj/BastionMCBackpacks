name: BastionMCBackpacks
version: '1.0.4'
main: mc.bastion.backpacks.BastionMCBackpacks
api-version: '1.21'
author: BASTION MC
description: 25 mochilas persistentes, GUI configurable y permisos LuckPerms.
commands:
  pv:
    description: Abre tus mochilas o una mochila por número.
    usage: /pv [1-25] | /mochilas ver <jugador> [1-25] | /mochilas reload
    aliases: [mochila, mochilas]
permissions:
